name: CLI launcher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      WRANGLER_SEND_METRICS: "false"
      npm_config_manage_package_manager_versions: "false"
      npm_config_verify_deps_before_run: "false"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      STUBS_TEST_PUBLISHED_LAUNCHER: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Test packed local launchers and startup guards
        run: node node_modules/vitest/vitest.mjs run --project cli cli/test/launcher.test.ts
